<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backupino — Modern WordPress Backup, Cloning & Easy Migration</title>
    <meta
      name="description"
      content="Backupino is a modern, resumable, self-contained WordPress backup, cloning and easy migration platform. 100% free restore, anti-timeout chunk engine, standalone installer.php and offline-first architecture."
    />
    <meta name="author" content="Backupino" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Backupino" />
    <meta property="og:title" content="Backupino — Modern WordPress Backup, Cloning & Easy Migration" />
    <meta
      property="og:description"
      content="Eliminating paywalls for site restoration, defeating timeout crashes on real-world shared hosting, and delivering an ultra-fast, 100% offline-first migration experience."
    />
    <meta property="og:url" content="https://github.com/Backupino/plugin" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Backupino — WordPress Backup & Migration" />
    <meta
      name="twitter:description"
      content="Fast, resumable WordPress backups, cloning and easy migration platform with a self-contained offline installer. 100% free forever."
    />

    <!-- Inline SVG favicon -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 7c-4.97 0-9 3.58-9 8 0 3.87 3.13 7 7 7h5a5 5 0 0 0 .8-9.92A6.5 6.5 0 0 0 16 7z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 13v6m0 0-2.5-2.5M16 19l2.5-2.5' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />

    <!-- Fonts: Inter (English) + Vazirmatn (Persian) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Early theme/language bootstrap: prevents flash of wrong theme -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (!theme) {
            theme =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
          var lang = localStorage.getItem("lang") || "en";
          document.documentElement.setAttribute("lang", lang);
          document.documentElement.setAttribute("dir", lang === "fa" ? "rtl" : "ltr");
        } catch (e) {
          /* no-op */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
