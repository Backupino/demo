  <style>
    @keyframes artFloatA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes artFloatB { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes artSpinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes artPulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 1; } }
    .cloud { animation: artFloatA 4s ease-in-out infinite; }
    .spin { animation: artSpinSlow 12s linear infinite; transform-origin: 200px 165px; }
    .pulse { animation: artPulse 2s ease-in-out infinite; transform-origin: center; }
  </style>
